version: '3.8'

services:
  # Nginx: 前端 + 反向代理
  nginx:
    image: nginx:alpine
    container_name: aph-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./packages/web/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - aph-network

  # NestJS 后端
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: aph-server
    restart: unless-stopped
    expose:
      - '3000'
    volumes:
      - ./packages/server/uploads:/app/uploads
    environment:
      # 必填项缺失直接报错，杜绝弱密钥兜底（注意：此文件为 legacy Docker/MySQL 方案，当前生产为 PM2 + SQLite）
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 未配置}@mysql:3306/ai_prompt_hub
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET 未配置}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET 未配置}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-3.5-turbo}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aph-network

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: aph-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 未配置}
      MYSQL_DATABASE: ai_prompt_hub
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    expose:
      - '3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aph-network

volumes:
  mysql_data:

networks:
  aph-network:
    driver: bridge
