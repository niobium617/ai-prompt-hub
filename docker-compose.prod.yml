version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: aph-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./packages/web/dist:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - server
    networks:
      - aph-network

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: aph-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=mysql://root:${DB_ROOT_PASSWORD:-root123}@mysql:3306/ai_prompt_hub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ES_NODE=http://elasticsearch:9200
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aph-network

  mysql:
    image: mysql:8.0
    container_name: aph-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ai_prompt_hub
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aph-network

  redis:
    image: redis:7-alpine
    container_name: aph-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aph-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: aph-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - aph-network

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  aph-network:
    driver: bridge
