name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署到 ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd ~/ai-prompt-hub
            git pull
            pnpm install --silent || true
            pnpm build:server
            pnpm build:web
            pm2 restart aph-server --silent || pm2 start packages/server/dist/main.js --name aph-server
            pm2 save --silent
            sudo systemctl restart nginx
            echo "✅ 部署完成"
